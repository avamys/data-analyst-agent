[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ipykernel",
  "jinja2",
  "matplotlib",
  "langchain",
  "langchain_experimental",
  "langchain_ollama",
  "langgraph",
  "langsmith",
  "mlflow",
  "pandas",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "tabulate",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]