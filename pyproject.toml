[project]
name = "agent"
version = "0.1.0"
description = "Local-first data analyst agent that plans, runs and reports analyses of CSV datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "jinja2",
  "matplotlib",
  "langchain",
  "langchain_experimental",
  "langchain_ollama",
  "langgraph",
  "langsmith",
  "pandas",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "tabulate",
]

[dependency-groups]
dev = [
  "ipykernel",
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "*.md",               # code blocks in docs are illustrative sketches
  "docs/baseline/run",  # generated code from the reference run, kept verbatim
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
