[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ipykernel",
  "matplotlib",
  "langchain",
  "langchain_experimental",
  "langchain_ollama",
  "langgraph",
  "mlflow",
  "pandas",
  "scikit-learn",
  "scipy",
  "autogen-core",
  "autogen-ext[ollama]",
  "tabulate",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]