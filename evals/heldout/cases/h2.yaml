description: >
  The directions are the finding. Renewal is exactly 80%, 65%, 50% and 35% at
  0%, 10%, 20% and 30% discount: bigger discounts go with less renewal. More
  support_tickets and more seats go with more renewal. Discount, tickets and
  seats top any importance ranking, so a report listing only importances
  misses that both intuitive directions are reversed. contract_months, region
  and signup_month have no effect.
file: accounts.csv
target: renewed
data: {generator: ho_accounts, seed: 1}
facts:
  - {name: no_discount_renewal, value: 0.8, near: [discount]}
  - {name: top_discount_renewal, value: 0.35, near: [discount]}
must_find:
  - Renewal falls as discount_pct rises, from about 80% at no discount to about 35% at a 30% discount.
  - Accounts with more support_tickets are more likely to renew.
  - Accounts with more seats are more likely to renew.
  - contract_months, region and signup_month show no meaningful relationship with renewal.
must_not_claim:
  - Larger discounts increase the chance that an account renews.
  - Accounts that file more support tickets are less likely to renew.
caveats:
  targeting: [causal, observational, targeted, at-risk]
  engagement: [engagement, proxy, usage]